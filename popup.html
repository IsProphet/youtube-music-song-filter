<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>YTM Song Filter</title>

<style>
body {
    font-family: sans-serif;
    width: 300px;
    padding: 10px;
    box-sizing: border-box;
    background-color: #141414;
    color: #e0e0e0;
}

h3 {
    margin-top: 0;
}

textarea {
    width: 100%;
    height: 150px;
    resize: vertical;
    box-sizing: border-box;
    background-color: #222;
    color: #fff;
    border: none;
    padding: 8px;
    outline: none;
}

button {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    background-color: #202020;
    color: #e0e0e0;
    border: none;
    cursor: pointer;
}

.info {
    margin-top: 10px;
    font-size: 12px;
    color: #e0e0e0;
}
</style>
</head>

<body>
<h3>Skip Keywords</h3>

<textarea
    id="keywords"
    placeholder="One keyword per line"
></textarea>

<label>
    <input type="checkbox" id="enabled">
    Enable automatic skipping
</label>

<button id="save">Save</button>

<div class="info">
Song titles containing any keyword will be skipped.
</div>

<script src="popup.js"></script>
</body>
</html>
